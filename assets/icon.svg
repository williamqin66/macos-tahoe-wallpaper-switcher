<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>aerial-switch</title>
  <defs>
    <clipPath id="shape">
      <rect x="64" y="64" width="896" height="896" rx="200"/>
    </clipPath>
    <!-- sky: night at the top, dusk in the middle, sunrise glow at the horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a3d"/>
      <stop offset="0.38" stop-color="#3b3a78"/>
      <stop offset="0.58" stop-color="#b8608a"/>
      <stop offset="0.68" stop-color="#f39a6b"/>
      <stop offset="0.72" stop-color="#ffd08a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e98a6c"/>
      <stop offset="0.35" stop-color="#5a4a86"/>
      <stop offset="1" stop-color="#151b3e"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="700" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb070" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="1" stop-color="#ffc067"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd9a8" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#shape)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="210" cy="190" r="5" opacity="0.9"/>
      <circle cx="330" cy="140" r="3" opacity="0.7"/>
      <circle cx="760" cy="170" r="4" opacity="0.85"/>
      <circle cx="840" cy="260" r="3" opacity="0.6"/>
      <circle cx="160" cy="320" r="3" opacity="0.55"/>
      <circle cx="660" cy="110" r="3" opacity="0.6"/>
    </g>

    <circle cx="512" cy="700" r="300" fill="url(#glow)"/>

    <!-- the sun on the horizon -->
    <circle cx="512" cy="700" r="118" fill="url(#sun)"/>

    <!-- Tahoe: mountain ridge on the left -->
    <path d="M0 700 L0 560 L100 482 L160 524 L250 410 L340 520 L410 700 Z" fill="#2a2457" opacity="0.92"/>
    <path d="M250 410 L288 456 L268 452 L250 476 L232 452 L212 458 Z" fill="#e9e4ff" opacity="0.85"/>

    <!-- Golden Gate: bridge tower and cables on the right -->
    <g fill="none" stroke="#c4473a" stroke-linecap="round">
      <path d="M560 640 Q680 560 760 430" stroke-width="7"/>
      <path d="M760 430 Q860 560 1024 600" stroke-width="7"/>
      <line x1="540" y1="652" x2="1024" y2="652" stroke-width="16"/>
    </g>
    <g fill="#c4473a">
      <rect x="744" y="410" width="12" height="290"/>
      <rect x="772" y="410" width="12" height="290"/>
      <rect x="744" y="470" width="40" height="10"/>
      <rect x="744" y="540" width="40" height="10"/>
      <rect x="744" y="606" width="40" height="10"/>
    </g>
    <g stroke="#c4473a" stroke-width="3" opacity="0.8">
      <line x1="620" y1="604" x2="620" y2="650"/>
      <line x1="680" y1="556" x2="680" y2="650"/>
      <line x1="720" y1="502" x2="720" y2="650"/>
      <line x1="820" y1="500" x2="820" y2="650"/>
      <line x1="880" y1="550" x2="880" y2="650"/>
      <line x1="950" y1="582" x2="950" y2="650"/>
    </g>

    <!-- water -->
    <rect x="0" y="700" width="1024" height="324" fill="url(#water)"/>
    <g stroke="#ffe1b0" stroke-linecap="round" opacity="0.75">
      <line x1="420" y1="740" x2="604" y2="740" stroke-width="10"/>
      <line x1="448" y1="784" x2="576" y2="784" stroke-width="8" opacity="0.7"/>
      <line x1="480" y1="824" x2="544" y2="824" stroke-width="6" opacity="0.5"/>
    </g>

    <!-- the switch: a cycle arc around the sun -->
    <g fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round">
      <path d="M339 600 A200 200 0 0 1 680 590"/>
    </g>
    <path d="M710 644 L706 572 L650 608 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
